# SPDX-License-Identifier: LicenseRef-STREAK-NC-Research-1.0
[project]
name = "streak"
version = "0.2.0"
description = "Simulation study: when can activity streaks diverge from retention in a learning model?"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.1",
]

[project.scripts]
streak = "streak.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
]

[tool.uv]
# M2: the project is built as the package `streak` (src/streak) with the uv_build backend.
package = true
# Only versions released at least two weeks before 2026-11-24 (decision D-005).
exclude-newer = "2026-11-10T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
